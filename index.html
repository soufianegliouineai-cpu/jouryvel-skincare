<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1b2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JOURYVEL">
<meta name="mobile-web-app-capable" content="yes">
<title>JOURYVEL — Couple's Skincare</title>
<style>
:root{
  --bg:#faf6ed;
  --bg2:#f5e6c8;
  --card:#fff;
  --ink:#0d1b2a;
  --ink2:#1b263b;
  --gold:#d4af37;
  --gold2:#8b6914;
  --gold3:#f4cf57;
  --gold4:#f5e6c8;
  --green:#22c55e;
  --green2:#166534;
  --orange:#f59e0b;
  --orange2:#c2410c;
  --purple:#a855f7;
  --purple2:#6d28d9;
  --pink:#ec4899;
  --pink2:#9d174d;
  --red:#dc2626;
  --red2:#991b1b;
  --muted:#999;
  --text:#555;
  --line:rgba(212,175,55,.2);
  --shadow:0 8px 25px rgba(0,0,0,.1);
  --accent:var(--gold);
  --accent2:var(--gold2);
}
[data-profile="him"]{
  --accent:#3b82f6;
  --accent2:#1e40af;
}
[data-profile="her"]{
  --accent:#ec4899;
  --accent2:#9d174d;
}
[data-theme="dark"]{
  --bg:#0a0f1a;
  --bg2:#0d1b2a;
  --card:#1b263b;
  --ink:#f4cf57;
  --ink2:#fff;
  --gold:#f4cf57;
  --gold2:#d4af37;
  --gold3:#f4cf57;
  --gold4:#2e4035;
  --muted:#888;
  --text:#ccc;
  --line:rgba(212,175,55,.3);
  --shadow:0 8px 25px rgba(0,0,0,.4);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);transition:background .4s,color .4s}
.app{max-width:480px;margin:0 auto;padding:8px;height:100vh;display:flex;flex-direction:column;overflow:hidden;position:relative}

.prof{background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:14px;padding:8px 10px;margin-bottom:8px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(0,0,0,.2);border:2px solid #fff;flex-shrink:0}
.prof-av{width:40px;height:40px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 3px 8px rgba(0,0,0,.2);flex-shrink:0}
.prof-info{flex:1;color:#fff;min-width:0}
.prof-info b{font-size:13px;display:block;font-weight:800}
.prof-info span{font-size:9px;opacity:.95}
.prof-sw{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.3);padding:5px 10px;border-radius:8px;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit}
.prof-sw:active{transform:scale(.95)}

.hdr{background:linear-gradient(135deg,#0d1b2a 0%,#1b263b 50%,#2e4035 100%);color:#f4cf57;padding:14px 16px;border-radius:18px;text-align:center;margin-bottom:8px;box-shadow:0 8px 25px rgba(13,27,42,.4);border:2px solid #d4af37;position:relative;flex-shrink:0}
.hdr h1{font-size:24px;font-weight:900;letter-spacing:3px;text-shadow:0 2px 4px rgba(212,175,55,.4);margin-bottom:2px}
.hdr p{font-size:9px;color:#f5e6c8;letter-spacing:2px;opacity:.9}
.hdr .or{color:#d4af37;margin-top:4px;font-size:10px;letter-spacing:2px}
.hdr .streak{position:absolute;top:8px;left:10px;background:linear-gradient(135deg,#dc2626,#f59e0b);color:#fff;padding:3px 8px;border-radius:10px;font-size:10px;font-weight:700;display:flex;align-items:center;gap:3px;box-shadow:0 3px 10px rgba(220,38,38,.4)}
.hdr .lvl{position:absolute;top:8px;right:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;padding:3px 8px;border-radius:10px;font-size:10px;font-weight:700;display:flex;align-items:center;gap:3px;box-shadow:0 3px 10px rgba(0,0,0,.3)}

.nav{display:flex;align-items:center;background:var(--card);border-radius:12px;padding:5px;margin-bottom:6px;box-shadow:var(--shadow);border:1px solid var(--accent);flex-shrink:0}
.nb{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;width:36px;height:36px;border-radius:9px;font-size:16px;font-weight:700;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.3)}
.nb:active{transform:scale(.9)}
.di{flex:1;text-align:center;padding:0 8px;min-width:0}
.dn1{font-size:8px;color:var(--accent2);font-weight:700;letter-spacing:2px;text-transform:uppercase}
.dn2{font-size:16px;font-weight:800;color:var(--ink);margin:1px 0;letter-spacing:.3px}
.dn3{font-size:9px;color:var(--green2);font-weight:700;letter-spacing:1.5px;text-transform:uppercase}
[data-theme="dark"] .dn3{color:#22c55e}

.prog{height:4px;background:rgba(212,175,55,.15);border-radius:2px;margin-bottom:4px;overflow:hidden;flex-shrink:0;position:relative}
.progF{height:100%;background:linear-gradient(to right,var(--accent),var(--accent2));border-radius:2px;transition:width .5s ease;box-shadow:0 0 8px rgba(0,0,0,.3);position:relative}
.progF::after{content:'';position:absolute;top:0;right:0;bottom:0;width:20px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4));animation:shine 2s linear infinite}
@keyframes shine{0%{transform:translateX(-20px)}100%{transform:translateX(300px)}}
.progT{text-align:center;font-size:9px;color:var(--accent2);font-weight:700;margin-bottom:6px}

.crd{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:8px;border:1px solid var(--line);transition:transform .3s ease,opacity .3s ease;position:relative;flex:1;display:flex;flex-direction:column;min-height:0}
.crd.sw{transition:none}
.crd.sl{transform:translateX(-110%);opacity:0}
.crd.sr{transform:translateX(110%);opacity:0}

.ch{padding:18px;color:#fff;text-align:center;border-bottom:3px solid #d4af37;position:relative;overflow:hidden;flex-shrink:0}
.ch::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:radial-gradient(circle at top,rgba(255,255,255,.15) 0%,transparent 60%);pointer-events:none}
.ch.g{background:linear-gradient(135deg,#c2410c 0%,#f59e0b 100%)}
.ch.r{background:linear-gradient(135deg,#6d28d9 0%,#a855f7 100%)}
.ch.rec{background:linear-gradient(135deg,#166534 0%,#22c55e 100%)}
.ch.p{background:linear-gradient(135deg,#991b1b 0%,#dc2626 100%)}
.ch.b{background:linear-gradient(135deg,#0c4a6e 0%,#0ea5e9 100%)}
.ch .ic{font-size:32px;margin-bottom:2px;position:relative;z-index:1}
.ch .dn{font-size:22px;font-weight:800;letter-spacing:.5px;position:relative;z-index:1}
.ch .dt{display:inline-block;background:rgba(255,255,255,.25);backdrop-filter:blur(10px);padding:3px 12px;border-radius:12px;font-size:10px;font-weight:700;letter-spacing:1.5px;margin-top:5px;position:relative;z-index:1;text-transform:uppercase}
.ch .ct{margin-top:8px;font-size:10px;opacity:.95;position:relative;z-index:1;font-weight:600;line-height:1.4}

.tbs{display:flex;background:linear-gradient(to bottom,var(--bg) 0%,var(--card) 100%);border-bottom:1px solid var(--line);flex-shrink:0}
.tb{flex:1;padding:12px 6px;background:transparent;border:none;cursor:pointer;font-family:inherit;font-size:12px;font-weight:700;color:var(--muted);position:relative;transition:color .3s}
.tb.a{color:var(--ink)}
.tb.a::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(to right,var(--accent),var(--accent2))}
.tb .ti{margin-left:3px;font-size:14px}
.tb .tc{background:rgba(212,175,55,.2);color:var(--accent2);padding:1px 6px;border-radius:6px;font-size:8px;font-weight:700;margin-right:3px}
.tb.a .tc{background:var(--accent);color:#fff}

.tc2{display:none;padding:12px;overflow-y:auto;flex:1;min-height:0;-webkit-overflow-scrolling:touch}
.tc2.a{display:block;animation:fi .4s ease}
.tc2::-webkit-scrollbar{width:4px}
.tc2::-webkit-scrollbar-thumb{background:var(--accent);border-radius:2px}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.gd{display:flex;align-items:center;margin:8px 0}
.gd::before,.gd::after{content:'';flex:1;height:1px;background:linear-gradient(to right,transparent,var(--accent),transparent)}
.gd span{margin:0 5px;color:var(--accent);font-size:10px}

.st{list-style:none;counter-reset:st}
.st li{padding:8px 10px 8px 36px;margin-bottom:6px;background:linear-gradient(135deg,var(--bg) 0%,var(--bg2) 100%);border-radius:10px;font-size:11px;line-height:1.4;border-right:3px solid var(--accent);box-shadow:0 2px 6px rgba(0,0,0,.04);position:relative;counter-increment:st;transition:all .3s;cursor:pointer}
.st li.done{opacity:.55;text-decoration:line-through;background:linear-gradient(135deg,rgba(34,197,94,.1),rgba(34,197,94,.05));border-right-color:var(--green)}
.st li:active{transform:scale(.98)}
.sp{font-weight:800;color:var(--ink);font-size:12px;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.sp::before{content:attr(data-thumb);display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--bg2),var(--bg));font-size:20px;box-shadow:0 2px 6px rgba(0,0,0,.1),inset 0 1px 2px rgba(255,255,255,.2);flex-shrink:0;border:1px solid var(--line);transition:all .3s}
.st li.done .sp::before{opacity:.5;filter:grayscale(.5)}
.st li:hover .sp::before{transform:scale(1.1) rotate(-5deg);box-shadow:0 4px 12px rgba(0,0,0,.15)}
.sp .nm{flex:1;line-height:1.2}
.su{font-size:10px;color:var(--text);display:block;line-height:1.4}
.su b{color:var(--accent2);font-weight:800}
[data-theme="dark"] .su b{color:var(--accent)}
.sm{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap}
.mt{padding:2px 5px;border-radius:5px;font-size:8px;font-weight:700;display:inline-block}
.mt.a{background:#fce7f3;color:#9f1239}
.mt.t{background:#dbeafe;color:#1e40af}
.mt.w{background:#d1fae5;color:#065f46}
.mt.n{background:#fef3c7;color:#92400e}
.mt.c{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;padding:2px 7px;cursor:pointer}

.wrn{background:linear-gradient(135deg,#fef2f2,#fee2e2);border:1px solid #fecaca;border-right:3px solid var(--red);padding:8px 10px;border-radius:8px;margin-top:8px;font-size:10px;color:#7f1d1d;line-height:1.5}
.wrn b{color:var(--red2)}

.ind{display:flex;justify-content:center;gap:4px;margin:8px 0;flex-shrink:0}
.ii{width:6px;height:6px;border-radius:50%;background:rgba(212,175,55,.3);cursor:pointer;transition:all .3s}
.ii.a{background:var(--accent);width:20px;border-radius:3px;box-shadow:0 0 6px rgba(0,0,0,.3)}
.ii.done{background:var(--green)}
.ii.partial{background:var(--orange)}

.fab{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:20px;width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:2px solid #fff;box-shadow:0 6px 18px rgba(0,0,0,.4);font-size:20px;cursor:pointer;z-index:50;display:flex;align-items:center;justify-content:center}
.fab2{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom));left:20px;width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#1b263b,#0d1b2a);color:var(--accent);border:2px solid var(--accent);box-shadow:0 6px 18px rgba(0,0,0,.3);font-size:20px;cursor:pointer;z-index:50;display:flex;align-items:center;justify-content:center}
.fab3{position:fixed;bottom:calc(132px + env(safe-area-inset-bottom));left:20px;width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#22c55e,#166534);color:#fff;border:2px solid #fff;box-shadow:0 6px 18px rgba(34,197,94,.5);font-size:20px;cursor:pointer;z-index:50;display:flex;align-items:center;justify-content:center}
.fab4{position:fixed;bottom:calc(188px + env(safe-area-inset-bottom));left:20px;width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#0d1b2a,#1b263b);color:var(--gold3);border:2px solid var(--gold);box-shadow:0 6px 18px rgba(0,0,0,.3);font-size:20px;cursor:pointer;z-index:50;display:flex;align-items:center;justify-content:center}
.fab5{position:fixed;bottom:calc(244px + env(safe-area-inset-bottom));left:20px;width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#a855f7,#6d28d9);color:#fff;border:2px solid #fff;box-shadow:0 6px 18px rgba(168,85,247,.5);font-size:20px;cursor:pointer;z-index:50;display:flex;align-items:center;justify-content:center}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);z-index:100;display:none;align-items:center;justify-content:center;padding:20px;animation:fi2 .3s}
.modal.show{display:flex}
@keyframes fi2{from{opacity:0}to{opacity:1}}
.mbox{background:var(--card);border-radius:18px;padding:20px;max-width:400px;width:100%;max-height:80vh;overflow-y:auto;border:2px solid var(--accent);box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop2 .4s}
@keyframes pop2{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1)}}
.mbox h3{color:var(--ink);font-size:18px;margin-bottom:12px;text-align:center;font-weight:800}
.mbox h4{color:var(--accent2);font-size:13px;margin:10px 0 6px;font-weight:700}
.mbox p{font-size:12px;line-height:1.6;color:var(--text);margin-bottom:10px}
.mbox .item{padding:10px;background:var(--bg);border-radius:8px;margin-bottom:6px;border-right:3px solid var(--accent)}
.mbox .item b{color:var(--ink);font-size:12px;display:block;margin-bottom:2px}
.mbox .item span{font-size:10px;color:var(--text);line-height:1.4;display:block}
.mbtn{display:block;width:100%;padding:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:10px;font-family:inherit;font-size:13px;font-weight:700;margin-top:8px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.mbtn:active{transform:scale(.97)}
.mbtn.s{border:1px solid var(--line);background:var(--card);color:var(--ink)}
.mbtn.gold{background:linear-gradient(135deg,var(--gold),var(--gold2))}

.profile-card{padding:14px;border-radius:12px;margin-bottom:10px;cursor:pointer;border:2px solid var(--line);display:flex;align-items:center;gap:10px;transition:all .3s}
.profile-card.a{border-color:var(--accent);box-shadow:0 4px 12px rgba(0,0,0,.2)}
.profile-card:active{transform:scale(.98)}
.profile-card .av{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;background:linear-gradient(135deg,var(--bg),var(--bg2));border:2px solid var(--accent);flex-shrink:0}
.profile-card .info{flex:1}
.profile-card .info b{color:var(--ink);font-size:14px;display:block;margin-bottom:2px}
.profile-card .info span{font-size:10px;color:var(--text);line-height:1.4;display:block}
.profile-card.him{background:linear-gradient(135deg,rgba(59,130,246,.05),rgba(59,130,246,.1))}
.profile-card.him.a{background:linear-gradient(135deg,rgba(59,130,246,.15),rgba(59,130,246,.2))}
.profile-card.her{background:linear-gradient(135deg,rgba(236,72,153,.05),rgba(236,72,153,.1))}
.profile-card.her.a{background:linear-gradient(135deg,rgba(236,72,153,.15),rgba(236,72,153,.2))}

.celeb{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.8);backdrop-filter:blur(10px);pointer-events:none}
.celeb.show{display:flex;animation:fi2 .3s}
.celeb .cb{text-align:center;color:#fff;animation:pop2 .5s}
.celeb .emo{font-size:80px;margin-bottom:10px;animation:beat 1s infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.celeb .tx{font-size:24px;font-weight:800;background:linear-gradient(135deg,var(--gold),var(--gold3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px}
.celeb .sx{font-size:13px;opacity:.9}
.confetti{position:absolute;width:10px;height:10px;pointer-events:none;animation:fall 3s linear forwards}
@keyframes fall{0%{transform:translateY(-100px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}

.conf{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(100px);background:linear-gradient(135deg,var(--ink),var(--ink2));color:var(--gold3);padding:10px 18px;border-radius:22px;font-size:12px;font-weight:700;box-shadow:0 8px 25px rgba(0,0,0,.3);z-index:150;transition:transform .4s cubic-bezier(.34,1.56,.64,1);border:1px solid var(--gold);pointer-events:none;max-width:80%;text-align:center}
.conf.show{transform:translateX(-50%) translateY(0)}

.stats{background:linear-gradient(135deg,var(--bg),var(--bg2));border-radius:12px;padding:12px;margin-bottom:8px;border:1px solid var(--line)}
.stats h4{color:var(--ink);font-size:12px;margin-bottom:8px;text-align:center}
.stats .row{display:flex;justify-content:space-between;font-size:10px;padding:4px 0;border-bottom:1px solid var(--line)}
.stats .row:last-child{border:none}
.stats .row b{color:var(--accent2)}
[data-theme="dark"] .stats .row b{color:var(--accent)}

.ach{background:linear-gradient(135deg,var(--ink),var(--ink2));color:var(--gold3);border-radius:10px;padding:8px 10px;margin-bottom:6px;display:flex;align-items:center;gap:8px;font-size:11px}
.ach.un{opacity:.4;filter:grayscale(1)}
.ach .ic{font-size:24px}
.ach .info{flex:1}
.ach .info b{display:block;color:var(--gold3);font-size:11px;margin-bottom:1px}
.ach .info span{font-size:9px;color:var(--gold4);opacity:.8}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin:8px 0}
.cal .c{aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.cal .c.t{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:var(--accent)}
.cal .c.d{background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;border-color:var(--green)}
.cal .c.p{background:linear-gradient(135deg,var(--orange),#fbbf24);color:#fff;border-color:var(--orange)}

.bm{background:linear-gradient(135deg,var(--ink),var(--ink2));color:var(--gold3);border-radius:10px;padding:10px 12px;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.bm .ic{font-size:20px}
.bm .info{flex:1}
.bm .info b{font-size:11px;display:block;margin-bottom:1px}
.bm .info span{font-size:9px;color:var(--gold4);opacity:.8}
.bm .act{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;padding:6px 10px;border-radius:7px;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit}

.notes{background:var(--bg);border-radius:8px;padding:8px;margin-top:6px;font-size:10px;color:var(--text);line-height:1.4;border-right:3px solid var(--accent);display:flex;justify-content:space-between;align-items:center;gap:8px}
.notes span{flex:1}
.notes button{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;padding:4px 8px;border-radius:6px;font-size:9px;font-weight:700;cursor:pointer;font-family:inherit;flex-shrink:0}

textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;font-family:inherit;font-size:11px;color:var(--ink);min-height:70px;resize:vertical}
textarea:focus{outline:none;border-color:var(--accent)}

.share-card{background:linear-gradient(135deg,var(--ink),var(--ink2));border-radius:12px;padding:14px;color:var(--gold3);text-align:center;margin-bottom:8px;border:2px solid var(--gold)}
.share-card h4{color:var(--gold3);font-size:13px;margin-bottom:6px}
.share-card .sc{font-size:10px;color:var(--gold4);margin:3px 0;line-height:1.4}
.share-card .em{font-size:30px;margin:6px 0}

.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:8px 0}
.gallery div{aspect-ratio:1;background:var(--bg);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:24px;border:1px solid var(--line);cursor:pointer}
.gallery div.plus{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:20px}

.aiBox{background:linear-gradient(135deg,#0a0f1a,#1b263b);border:2px solid var(--gold);border-radius:12px;padding:14px;margin-bottom:8px;color:#fff}
.aiBox h4{color:var(--gold3);font-size:13px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.aiBox .ic{font-size:18px}
.aiBox .lbl{color:#aaa;font-size:10px;margin-bottom:3px}
.aiBox .val{color:#fff;font-size:12px;font-weight:600;margin-bottom:8px;line-height:1.4}
.aiBox .row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(212,175,55,.15);font-size:11px}
.aiBox .row:last-child{border:none}
.aiBox .row b{color:var(--gold3)}
.aiBox .score{background:linear-gradient(135deg,var(--gold),var(--gold2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-size:24px;font-weight:800}

.aiChat{background:linear-gradient(135deg,var(--bg),var(--bg2));border-radius:12px;padding:12px;margin-top:10px;border:1px solid var(--line)}
.aiChat input{width:100%;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:10px 12px;font-family:inherit;font-size:13px;color:var(--ink);margin-bottom:8px;transition:border-color .3s}
.aiChat input:focus{outline:none;border-color:var(--accent)}
.aiChat .msgs{max-height:280px;overflow-y:auto;margin-bottom:10px;display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth}
.aiChat .msgs::-webkit-scrollbar{width:4px}
.aiChat .msgs::-webkit-scrollbar-thumb{background:var(--gold);border-radius:2px}
.aiChat .msg{padding:10px 12px;border-radius:12px;font-size:12px;line-height:1.6;max-width:90%;word-break:break-word}
.aiChat .msg.u{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;margin-right:auto;border-bottom-right-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.aiChat .msg.b{background:var(--card);color:var(--ink);margin-left:auto;border-bottom-left-radius:4px;border-right:none;border-left:3px solid var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.1);direction:rtl;text-align:right}
.aiChat .msg.b *{direction:rtl;text-align:right}
.aiChat .msg.b ol,.aiChat .msg.b ul{padding-right:16px;margin:6px 0}
.aiChat .msg.b li{margin-bottom:4px}
.aiChat .msg.b strong,.aiChat .msg.b b{color:var(--accent2)}

.skin{aspect-ratio:1;border-radius:12px;background:linear-gradient(135deg,#1b263b,#0d1b2a);border:2px dashed var(--gold);display:flex;align-items:center;justify-content:center;color:var(--gold3);font-size:30px;cursor:pointer;overflow:hidden;position:relative}
.skin img{width:100%;height:100%;object-fit:cover}
.skin .ov{position:absolute;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700}

@keyframes scan{0%{transform:translateY(0);opacity:1}100%{transform:translateY(100%);opacity:0}}
.scanLine{position:absolute;left:0;right:0;height:3px;background:linear-gradient(to right,transparent,var(--gold),transparent);animation:scan 2s linear infinite;box-shadow:0 0 10px var(--gold)}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:380px){.hdr h1{font-size:20px}.ch .dn{font-size:18px}.st li{padding:7px 9px 7px 32px;font-size:10px}}

var currentProfile='her',c=0,ct='am',prog={},ach={},streak=0,lastDay=-1,deferredPrompt=null,timerInt=null,bookmarks={},notes={},photos={},reminderTime='';
function D(){return PROGRAMS[currentProfile]}
function getKey(d,s,i){return d+'-'+s+'-'+i}
function load(){
try{
var p=localStorage.getItem('jouryvel-cur')||'her';
currentProfile=p;
var all=JSON.parse(localStorage.getItem('jouryvel-all')||'{}');
prog=all[p]&&all[p].prog?all[p].prog:{};
ach=all[p]&&all[p].ach?all[p].ach:{};
streak=all[p]&&all[p].streak?all[p].streak:0;
bookmarks=all[p]&&all[p].bm?all[p].bm:{};
notes=all[p]&&all[p].notes?all[p].notes:{};
photos=all[p]&&all[p].photos?all[p].photos:[];
reminderTime=all[p]&&all[p].reminder?all[p].reminder:'';
}catch(e){prog={};ach={};streak=0;bookmarks={};notes={};photos=[];reminderTime=''}
}
function save(){
try{
var all=JSON.parse(localStorage.getItem('jouryvel-all')||'{}');
all[currentProfile]={prog:prog,ach:ach,streak:streak,bm:bookmarks,notes:notes,photos:photos,reminder:reminderTime};
localStorage.setItem('jouryvel-all',JSON.stringify(all));
localStorage.setItem('jouryvel-cur',currentProfile);
}catch(e){}
}
function totalSteps(){var d=D();var t=0;for(var i=0;i<d.length;i++){t+=d[i].am.length+d[i].pm.length}return t}
function doneSteps(){var t=0;for(var k in prog){if(prog[k])t++}return t}
function isDayDone(d){var day=D()[d];for(var i=0;i<day.am.length;i++){if(!prog[getKey(d,'am',i)])return false}for(var i=0;i<day.pm.length;i++){if(!prog[getKey(d,'pm',i)])return false}return true}
function isDayPartial(d){var day=D()[d];for(var i=0;i<day.am.length;i++){if(prog[getKey(d,'am',i)])return true}for(var i=0;i<day.pm.length;i++){if(prog[getKey(d,'pm',i)])return true}return false}
function calcLevel(){var lvl=1;var xp=doneSteps();while(xp>=lvl*7)lvl++;return lvl}
function updateProfileUI(){
var p=PROFILES[currentProfile];
document.getElementById('pAv').textContent=p.av;
document.getElementById('pName').textContent=p.name;
document.body.dataset.profile=p.theme;
}
function tab(t){
ct=t;
var bs=document.querySelectorAll('.tb');
for(var i=0;i<bs.length;i++){bs[i].className=bs[i].dataset.t===t?'tb a':'tb'}
document.getElementById('am').className=t==='am'?'tc2 a':'tc2';
document.getElementById('pm').className=t==='pm'?'tc2 a':'tc2';
}

return '<span class="mt '+m[1]+'">'+m[0]+'</span>';
}).join('')+'<span class="mt c" onclick="toggleBm(event,\''+k+'\')" style="background:linear-gradient(135deg,'+(isBm?'var(--gold),var(--gold2)':'var(--muted),#666')+')">'+(isBm?'★ مفضل':'🔖 حفظ')+'</span></div></li>';
return html;
}

function formatAIResponse(text){
// Format the response nicely for RTL Arabic
if(!text)return '';
// Convert markdown-like **bold** to <strong>
text=text.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');
// Convert numbered lists to proper format
text=text.replace(/(\d+)[\.)] (.*?)(?=\n|$)/g,'<div style="margin:4px 0"><span style="background:var(--accent);color:#fff;border-radius:50%;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;margin-left:6px;vertical-align:middle">$1</span> $2</div>');
// Convert bullet points
text=text.replace(/• (.*?)(?=\n|$)/g,'<div style="margin:3px 0;padding-right:12px;position:relative">◆ $1</div>');
// Convert newlines to <br>
text=text.replace(/\n/g,'<br>');
return text;
}
function extractScore(t,i){
var m=t.match(/Score:(\d+)/i);
if(m)return m[1];
return ['78','85','82','88'][i]||'80';
}
function extractBrief(t){
var m=t.match(/Brief:?(.*?)(Score|$)/s);
if(m&&m[1])return m[1].trim().substring(0,150);
return t.substring(0,150);
}

function openStats(){

var pct=total>0?Math.round((done/total)*100):0;
var lvl=calcLevel();
var xp=doneSteps()-(lvl-1)*7;
var ACHIEVEMENTS=[
{id:'first_step',n:'البداية',d:'أول خطوة',ic:'🌱'},
{id:'first_day',n:'يوم كامل',d:'10 خطوات',ic:'🎯'},
{id:'half_week',n:'نصف الطريق',d:'3 أيام',ic:'⭐'},
{id:'full_week',n:'الأسبوع الذهبي',d:'7 أيام!',ic:'🏆'}
];
var h='<h3>📊 '+PROFILES[currentProfile].name+'</h3>';

h+='<div class="row"><span>الإنجاز</span><b>'+pct+'%</b></div>';
h+='<div class="row"><span>🔥 السلسلة</span><b>'+streak+' يوم</b></div>';
h+='</div>';
h+='<h4>🏆 الإنجازات</h4>';
for(var i=0;i<ACHIEVEMENTS.length;i++){
var a=ACHIEVEMENTS[i];

h+='<div class="ach '+(got?'':'un')+'"><div class="ic">'+a.ic+'</div><div class="info"><b>'+a.n+'</b><span>'+a.d+'</span></div>'+(got?'<div style="color:#22c55e;font-size:18px">✓</div>':'<div style="color:#666;font-size:11px">🔒</div>')+'</div>';
}
h+='<h4>📅 تقويم '+PROFILES[currentProfile].name+'</h4>';

var days=['س','ح','ن','ث','ر','خ','ج'];

function openTimer(e,name,minutes){
if(e)e.stopPropagation();
var sec=minutes*60;
var h='<h3>⏱ '+name+'</h3>';
h+='<div style="text-align:center;font-size:48px;font-weight:800;color:var(--accent2);margin:20px 0" id="tDsp">'+minutes+':00</div>';
h+='<div style="text-align:center;color:var(--muted);font-size:12px;margin-bottom:16px" id="tMsg">جاري التشغيل...</div>';
h+='<button class="mbtn" id="tBtn" onclick="stopTimer()">⏸ إيقاف</button>';
h+='<button class="mbtn s" onclick="closeM(\'timerM\')">إغلاق</button>';
document.getElementById('timerB').innerHTML=h;
document.getElementById('timerM').classList.add('show');
if(timerInt)clearInterval(timerInt);
timerInt=setInterval(function(){
sec--;
var m=Math.floor(sec/60),s=sec%60;
var dsp=document.getElementById('tDsp');
var msg=document.getElementById('tMsg');
if(dsp)dsp.textContent=m+':'+(s<10?'0':'')+s;
if(msg){
if(sec>0)msg.textContent='⏳ باقي '+m+' دقيقة و'+s+' ثانية';
else msg.textContent='✓ انتهى! اشطري وجهك الآن';
}
if(sec<=0){clearInterval(timerInt);timerInt=null;if(navigator.vibrate)navigator.vibrate([200,100,200])}
},1000);
}
function stopTimer(){if(timerInt){clearInterval(timerInt);timerInt=null}closeM('timerM')}
function closeM(id){document.getElementById(id).classList.remove('show')}
document.querySelectorAll('.modal').forEach(function(m){m.addEventListener('click',function(e){if(e.target===m)m.classList.remove('show')})});
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredPrompt=e;document.getElementById('iFab').style.display='flex'});
if('serviceWorker' in navigator){
var swCode="self.addEventListener('install',function(e){self.skipWaiting()});self.addEventListener('fetch',function(e){e.respondWith(fetch(e.request).catch(function(){return new Response('Offline')}))})";
var swBlob=new Blob([swCode],{type:'application/javascript'});
var swUrl=URL.createObjectURL(swBlob);
navigator.serviceWorker.register(swUrl).catch(function(){});
}
