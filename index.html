  --gold3:#f4cf57;
  --gold4:#f5e6c8;
  --green:#22c55e;
  --green2:#166534;
  --orange:#f59e0b;
  --orange2:#c2410c;
  --purple:#a855f7;
  --purple2:#6d28d9;
  --red:#dc2626;
  --red2:#991b1b;
  --muted:#999;
  --text:#555;
  --line:rgba(212,175,55,.2);
}
[data-theme="dark"]{
  --bg:#0a0f1a;
  --bg2:#0d1b2a;
  --card:#1b263b;
  --ink:#f4cf57;
  --ink2:#fff;
  --gold:#f4cf57;
  --gold2:#d4af37;
  --gold3:#f4cf57;
  --gold4:#2e4035;
  --muted:#888;
  --text:#ccc;
  --line:rgba(212,175,55,.3);

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);transition:background .4s,color .4s}
.app{max-width:480px;margin:0 auto;padding:8px;height:100vh;display:flex;flex-direction:column;overflow:hidden}

.hdr{background:linear-gradient(135deg,#0d1b2a 0%,#1b263b 50%,#2e4035 100%);color:#f4cf57;padding:14px 16px;border-radius:18px;text-align:center;margin-bottom:8px;box-shadow:0 8px 25px rgba(13,27,42,.4);border:2px solid #d4af37;position:relative;flex-shrink:0}
.hdr h1{font-size:24px;font-weight:900;letter-spacing:3px;text-shadow:0 2px 4px rgba(212,175,55,.4);margin-bottom:2px}
.hdr p{font-size:9px;color:#f5e6c8;letter-spacing:2px;opacity:.9}
.hdr .or{color:#d4af37;margin-top:4px;font-size:10px;letter-spacing:2px}

.nav{display:flex;align-items:center;background:var(--card);border-radius:12px;padding:5px;margin-bottom:8px;box-shadow:0 4px 15px rgba(0,0,0,.06);border:1px solid var(--gold);flex-shrink:0}
.nb{background:linear-gradient(135deg,#d4af37,#8b6914);color:#fff;border:none;width:36px;height:36px;border-radius:9px;font-size:16px;font-weight:700;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(212,175,55,.4)}

.di{flex:1;text-align:center;padding:0 8px;min-width:0}
.dn1{font-size:8px;color:var(--gold2);font-weight:700;letter-spacing:2px;text-transform:uppercase}
.dn2{font-size:16px;font-weight:800;color:var(--ink);margin:1px 0;letter-spacing:.3px}
.dn3{font-size:9px;color:var(--green2);font-weight:700;letter-spacing:1.5px;text-transform:uppercase}

.prog{height:4px;background:rgba(212,175,55,.15);border-radius:2px;margin-bottom:8px;overflow:hidden;flex-shrink:0}
.progF{height:100%;background:linear-gradient(to right,var(--gold),var(--gold2));border-radius:2px;transition:width .5s ease;box-shadow:0 0 8px rgba(212,175,55,.5)}

.crd{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 8px 25px rgba(0,0,0,.1);margin-bottom:8px;border:1px solid var(--line);transition:transform .3s ease,opacity .3s ease;position:relative;flex:1;display:flex;flex-direction:column;min-height:0}
.crd.sw{transition:none}
.crd.sl{transform:translateX(-110%);opacity:0}
.crd.sr{transform:translateX(110%);opacity:0}

.ch{padding:18px;color:#fff;text-align:center;border-bottom:3px solid #d4af37;position:relative;overflow:hidden;flex-shrink:0}
.ch::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:radial-gradient(circle at top,rgba(255,255,255,.15) 0%,transparent 60%);pointer-events:none}
.ch.g{background:linear-gradient(135deg,#c2410c 0%,#f59e0b 100%)}
.ch.r{background:linear-gradient(135deg,#6d28d9 0%,#a855f7 100%)}
.ch.rec{background:linear-gradient(135deg,#166534 0%,#22c55e 100%)}
.ch.p{background:linear-gradient(135deg,#991b1b 0%,#dc2626 100%)}
.ch .ic{font-size:32px;margin-bottom:2px;position:relative;z-index:1}
.ch .dn{font-size:22px;font-weight:800;letter-spacing:.5px;position:relative;z-index:1}
.ch .dt{display:inline-block;background:rgba(255,255,255,.25);backdrop-filter:blur(10px);padding:3px 12px;border-radius:12px;font-size:10px;font-weight:700;letter-spacing:1.5px;margin-top:5px;position:relative;z-index:1;text-transform:uppercase}
.ch .ct{margin-top:8px;font-size:10px;opacity:.95;position:relative;z-index:1;font-weight:600}

.tbs{display:flex;background:linear-gradient(to bottom,var(--bg) 0%,var(--card) 100%);border-bottom:1px solid var(--line);flex-shrink:0}
.tb{flex:1;padding:12px 6px;background:transparent;border:none;cursor:pointer;font-family:inherit;font-size:12px;font-weight:700;color:var(--muted);position:relative;transition:color .3s}
.tb.a{color:var(--ink)}
.tb.a::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(to right,var(--gold),var(--gold2))}
.tb .ti{margin-left:3px;font-size:14px}
.tb .tc{background:rgba(212,175,55,.2);color:var(--gold2);padding:1px 6px;border-radius:6px;font-size:8px;font-weight:700;margin-right:3px}
.tb.a .tc{background:var(--gold);color:#fff}
.tb .td{background:var(--green);color:#fff;width:14px;height:14px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:9px;margin-right:3px;vertical-align:middle;animation:pop .4s}
@keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.2)}100%{transform:scale(1)}}

.tc2{display:none;padding:12px;overflow-y:auto;flex:1;min-height:0;-webkit-overflow-scrolling:touch}
.tc2.a{display:block;animation:fi .4s ease}
.tc2::-webkit-scrollbar{width:4px}
.tc2::-webkit-scrollbar-thumb{background:var(--gold);border-radius:2px}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.gd{display:flex;align-items:center;margin:8px 0}
.gd::before,.gd::after{content:'';flex:1;height:1px;background:linear-gradient(to right,transparent,var(--gold),transparent)}
.gd span{margin:0 5px;color:var(--gold);font-size:10px}

.st{list-style:none;counter-reset:st}
.st li{padding:8px 10px 8px 36px;margin-bottom:6px;background:linear-gradient(135deg,var(--bg) 0%,var(--bg2) 100%);border-radius:10px;font-size:11px;line-height:1.4;border-right:3px solid var(--gold);box-shadow:0 2px 6px rgba(0,0,0,.04);position:relative;counter-increment:st;transition:all .3s;cursor:pointer}
.st li.done{opacity:.55;text-decoration:line-through;background:linear-gradient(135deg,rgba(34,197,94,.1),rgba(34,197,94,.05));border-right-color:var(--green)}
.st li.done::before{background:linear-gradient(135deg,var(--green),var(--green2))}
.st li:not(.done)::before{content:counter(st);position:absolute;left:8px;top:50%;transform:translateY(-50%);background:linear-gradient(135deg,var(--gold),var(--gold2));color:#fff;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:10px;box-shadow:0 2px 4px rgba(212,175,55,.3);transition:background .3s}
.st li::after{content:'☐';position:absolute;left:10px;top:50%;transform:translateY(-50%);width:18px;height:18px;font-size:14px;color:var(--gold);text-align:center;line-height:18px;display:none}
.st li:not(.done)::after{display:block}
.st li.done::after{display:none}
.st li.done::before{content:'✓';position:absolute;left:8px;top:50%;transform:translateY(-50%);background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;box-shadow:0 2px 4px rgba(34,197,94,.4)}

.su{font-size:10px;color:var(--text);display:block;line-height:1.4}
.su b{color:var(--gold2);font-weight:800}

.fab{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:20px;width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#fff;border:2px solid #fff;box-shadow:0 6px 18px rgba(212,175,55,.5);font-size:20px;cursor:pointer;z-index:50;display:flex;align-items:center;justify-content:center;transition:transform .3s}

.fab2{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom));left:20px;width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#1b263b,#0d1b2a);color:var(--gold3);border:2px solid var(--gold);box-shadow:0 6px 18px rgba(0,0,0,.3);font-size:20px;cursor:pointer;z-index:50;display:flex;align-items:center;justify-content:center;transition:transform .3s}

.mbox{background:var(--card);border-radius:18px;padding:20px;max-width:400px;width:100%;max-height:80vh;overflow-y:auto;border:2px solid var(--gold);box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop2 .4s}

.mbox h3{color:var(--ink);font-size:18px;margin-bottom:12px;text-align:center;font-weight:800}

.mbox .item{padding:10px;background:var(--bg);border-radius:8px;margin-bottom:6px;border-right:3px solid var(--gold)}

.mbtn{display:block;width:100%;padding:12px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#fff;border:none;border-radius:10px;font-family:inherit;font-size:13px;font-weight:700;margin-top:8px;cursor:pointer;box-shadow:0 4px 12px rgba(212,175,55,.4)}

.celeb .emo{font-size:80px;margin-bottom:10px;animation:beat 1s infinite}

.conf{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(100px);background:linear-gradient(135deg,var(--ink),var(--ink2));color:var(--gold3);padding:10px 18px;border-radius:22px;font-size:12px;font-weight:700;box-shadow:0 8px 25px rgba(0,0,0,.3);z-index:150;transition:transform .4s cubic-bezier(.34,1.56,.64,1);border:1px solid var(--gold);pointer-events:none}

@media(max-width:380px){.hdr h1{font-size:20px}.ch .dn{font-size:18px}.st li{padding:7px 9px 7px 32px;font-size:10px}}

var c=0,ct='am',prog={},deferredPrompt=null,isOnline=true;
function getKey(d,s,i){return d+'-'+s+'-'+i}
function loadProg(){
try{var p=localStorage.getItem('jouryvel-prog');prog=p?JSON.parse(p):{};}catch(e){prog={}}
}
function saveProg(){try{localStorage.setItem('jouryvel-prog',JSON.stringify(prog));}catch(e){}}
function totalSteps(){var t=0;for(var i=0;i<D.length;i++){t+=D[i].am.length+D[i].pm.length}return t}
function doneSteps(){var t=0;for(var k in prog){if(prog[k])t++}return t}
function isDayDone(d){var day=D[d];for(var i=0;i<day.am.length;i++){if(!prog[getKey(d,'am',i)])return false}for(var i=0;i<day.pm.length;i++){if(!prog[getKey(d,'pm',i)])return false}return true}
function tab(t){
ct=t;
var bs=document.querySelectorAll('.tb');
for(var i=0;i<bs.length;i++){bs[i].className=bs[i].dataset.t===t?'tb a':'tb'}
document.getElementById('am').className=t==='am'?'tc2 a':'tc2';
document.getElementById('pm').className=t==='pm'?'tc2 a':'tc2';
}
function makeLi(d,s,i,st){
var k=getKey(d,s,i);
var isDone=!!prog[k];
var html='<li class="'+(isDone?'done':'')+'" data-k="'+k+'" onclick="toggleStep(this)">';
html+='<span class="sp">'+st.p+'</span>';
html+='<span class="su">'+st.u+'</span>';
html+='<div class="sm">'+st.m.map(function(m){return '<span class="mt '+m[1]+'">'+m[0]+'</span>'}).join('')+'</div>';
html+='</li>';
return html;
}
function toggleStep(el){
var k=el.dataset.k;
if(prog[k]){delete prog[k];el.classList.remove('done')}
else{prog[k]=1;el.classList.add('done');showConf('✓ '+(el.querySelector('.sp').textContent).substring(0,20));checkDayComplete()}
saveProg();
updateProg();
updateIndicators();
updateTabCounts();
}
function showConf(t){
var c=document.getElementById('conf');
c.textContent=t;
c.classList.add('show');
setTimeout(function(){c.classList.remove('show')},1500);
}
function checkDayComplete(){
if(isDayDone(c)){celebrate()}
}
function celebrate(){
var d=D[c];
var c2=document.getElementById('celeb');
document.getElementById('ctx').textContent='أحسنتِ! 🎉';
document.getElementById('csx').textContent='أكملتِ روتين '+d.n;
c2.classList.add('show');
setTimeout(function(){c2.classList.remove('show')},3000);
}
function updateProg(){
var done=doneSteps(),total=totalSteps();
var pct=total>0?Math.round((done/total)*100):0;
document.getElementById('progF').style.width=pct+'%';
}
function updateIndicators(){
var ih='';
for(var i=0;i<D.length;i++){
var cls='ii';
if(i===c)cls+=' a';
else if(isDayDone(i))cls+=' done';
ih+='<div class="'+cls+'" onclick="go('+i+')"></div>';
}
document.getElementById('ind').innerHTML=ih;
}
function updateTabCounts(){
var d=D[c];
var amDone=0,pmDone=0;
for(var i=0;i<d.am.length;i++){if(prog[getKey(c,'am',i)])amDone++}
for(var i=0;i<d.pm.length;i++){if(prog[getKey(c,'pm',i)])pmDone++}
var ac=document.getElementById('ac'),pc=document.getElementById('pc');
ac.textContent=amDone+'/'+d.am.length;
pc.textContent=pmDone+'/'+d.pm.length;
if(amDone===d.am.length)ac.insertAdjacentHTML('afterend','<span class="td">✓</span>');
}
function render(){
var d=D[c];
document.getElementById('ch').className='ch '+d.c;
document.getElementById('ic').textContent=d.i;
document.getElementById('dn').textContent=d.n;
document.getElementById('dt').textContent=d.t;
document.getElementById('d1').textContent='اليوم '+(c+1)+' من 7';
document.getElementById('d2').textContent=d.n;
document.getElementById('d3').textContent=d.t;
document.getElementById('ct').textContent=d.why||'';

document.getElementById('pls').innerHTML=d.pm.map(function(s,i){return makeLi(c,'pm',i,s)}).join('');
var pw=document.getElementById('pw');
if(d.w){pw.innerHTML='⚠️ '+d.w;pw.style.display='block'}else{pw.style.display='none'}
updateTabCounts();
updateProg();
updateIndicators();
}
function prev(){var c2=document.getElementById('crd');c2.className='crd sw sr';setTimeout(function(){c=(c-1+D.length)%D.length;render();tab('am');c2.className='crd'},280)}

cc.addEventListener('mousedown',function(e){mx=e.clientX;dr=true});
cc.addEventListener('mouseup',function(e){if(!dr)return;dr=false;var d=e.clientX-mx;if(Math.abs(d)>50){d>0?prev():next()}});
