<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
<defs>
<linearGradient id="bg7" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" style="stop-color:#fef9c3;stop-opacity:1"/>
<stop offset="100%" style="stop-color:#fef08a;stop-opacity:1"/>
</linearGradient>
<linearGradient id="bottle7" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" style="stop-color:#eab308;stop-opacity:1"/>
<stop offset="50%" style="stop-color:#facc15;stop-opacity:1"/>
<stop offset="100%" style="stop-color:#ca8a04;stop-opacity:1"/>
</linearGradient>
<linearGradient id="cap7" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" style="stop-color:#0c0a09;stop-opacity:1"/>
<stop offset="100%" style="stop-color="#1c1917;stop-opacity:1"/>
</linearGradient>
</defs>
<rect width="200" height="240" fill="url(#bg7)"/>
<!-- Sun shape background -->
<circle cx="100" cy="120" r="60" fill="#fde047" opacity="0.3"/>
<!-- Bottle (slim) -->
<rect x="75" y="70" width="50" height="155" rx="3" fill="url(#bottle7)"/>
<!-- Pump cap -->
<rect x="80" y="25" width="40" height="50" rx="2" fill="url(#cap7)"/>
<rect x="92" y="20" width="16" height="8" rx="1" fill="#0c0a09"/>
<!-- Label -->
<rect x="78" y="105" width="44" height="100" fill="white" rx="1"/>
<text x="100" y="120" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="#854d0e">EUCERIN</text>
<line x1="83" y1="125" x2="117" y2="125" stroke="#fde047" stroke-width="0.5"/>
<text x="100" y="142" text-anchor="middle" font-family="Arial" font-size="7" fill="#713f12">Sun</text>
<text x="100" y="153" text-anchor="middle" font-family="Arial" font-size="7" fill="#713f12">Fluid</text>
<text x="100" y="172" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#854d0e">SPF</text>
<text x="100" y="187" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#854d0e">50+</text>
<text x="100" y="200" text-anchor="middle" font-family="Arial" font-size="6" fill="#a16207">50 ml</text>
<!-- Highlight -->
<rect x="78" y="75" width="3" height="145" fill="white" opacity="0.5" rx="1"/>
</svg>
