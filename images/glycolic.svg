<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
<defs>
<linearGradient id="bg5" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" style="stop-color:#fafafa;stop-opacity:1"/>
<stop offset="100%" style="stop-color:#e5e5e5;stop-opacity:1"/>
</linearGradient>
<linearGradient id="bottle5" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" style="stop-color:#f5f5f5;stop-opacity:1"/>
<stop offset="50%" style="stop-color:#ffffff;stop-opacity:1"/>
<stop offset="100%" style="stop-color:#d4d4d4;stop-opacity:1"/>
</linearGradient>
</defs>
<rect width="200" height="240" fill="url(#bg5)"/>
<!-- Toning solution bottle (taller) -->
<rect x="55" y="75" width="90" height="150" rx="4" fill="url(#bottle5)" stroke="#a3a3a3" stroke-width="1"/>
<!-- Cap -->
<rect x="63" y="20" width="74" height="60" rx="3" fill="#171717"/>
<rect x="65" y="35" width="70" height="40" fill="#262626"/>
<!-- Label -->
<rect x="58" y="100" width="84" height="110" fill="white" stroke="#e5e5e5" stroke-width="0.5"/>
<text x="100" y="115" text-anchor="middle" font-family="Arial" font-size="7" font-weight="bold" fill="#171717">THE</text>
<text x="100" y="125" text-anchor="middle" font-family="Arial" font-size="7" font-weight="bold" fill="#171717">ORDINARY</text>
<line x1="63" y1="130" x2="137" y2="130" stroke="#d4d4d4" stroke-width="0.5"/>
<text x="100" y="145" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="#171717">Glycolic Acid</text>
<text x="100" y="165" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#171717">7%</text>
<text x="100" y="180" text-anchor="middle" font-family="Arial" font-size="7" fill="#525252">Exfoliating Toner</text>
<text x="100" y="200" text-anchor="middle" font-family="Arial" font-size="6" fill="#737373">240 ml / 8 fl oz</text>
<!-- Highlight -->
<rect x="58" y="80" width="4" height="140" fill="white" opacity="0.7" rx="1"/>
</svg>
