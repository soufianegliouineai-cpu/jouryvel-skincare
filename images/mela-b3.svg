<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
<defs>
<linearGradient id="bg9" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" style="stop-color:#fdf2f8;stop-opacity:1"/>
<stop offset="100%" style="stop-color:#fce7f3;stop-opacity:1"/>
</linearGradient>
<linearGradient id="bottle9" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" style="stop-color:#f1f5f9;stop-opacity:1"/>
<stop offset="50%" style="stop-color:#ffffff;stop-opacity:1"/>
<stop offset="100%" style="stop-color:#cbd5e1;stop-opacity:1"/>
</linearGradient>
<linearGradient id="cap9" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" style="stop-color:#0c0a09;stop-opacity:1"/>
<stop offset="100%" style="stop-color="#1c1917;stop-opacity:1"/>
</linearGradient>
</defs>
<rect width="200" height="240" fill="url(#bg9)"/>
<!-- Cylinder bottle -->
<rect x="55" y="65" width="90" height="165" rx="4" fill="url(#bottle9)" stroke="#94a3b8" stroke-width="1"/>
<!-- Pump cap -->
<rect x="63" y="15" width="74" height="55" rx="3" fill="url(#cap9)"/>
<rect x="98" y="10" width="4" height="8" fill="#0c0a09"/>
<rect x="78" y="30" width="44" height="35" fill="#262626"/>
<!-- Label -->
<rect x="60" y="100" width="80" height="120" fill="white" rx="2" stroke="#fbcfe8" stroke-width="1"/>
<text x="100" y="118" text-anchor="middle" font-family="Arial" font-size="7" font-weight="bold" fill="#831843">LA ROCHE-POSAY</text>
<line x1="65" y1="124" x2="135" y2="124" stroke="#fbcfe8" stroke-width="0.5"/>
<text x="100" y="140" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#be185d">MELA B3</text>
<text x="100" y="155" text-anchor="middle" font-family="Arial" font-size="7" fill="#831843">SOIN CORPS</text>
<text x="100" y="167" text-anchor="middle" font-family="Arial" font-size="7" fill="#831843">BODY TREATMENT</text>
<text x="100" y="185" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="#831843">DARK SPOTS</text>
<text x="100" y="200" text-anchor="middle" font-family="Arial" font-size="6" fill="#9d174d">400 ml / 13.5 fl oz</text>
<text x="100" y="212" text-anchor="middle" font-family="Arial" font-size="5" fill="#9d174d">FOR ELBOWS, KNEES</text>
<!-- Highlight -->
<rect x="60" y="70" width="5" height="155" fill="white" opacity="0.6" rx="2"/>
</svg>
