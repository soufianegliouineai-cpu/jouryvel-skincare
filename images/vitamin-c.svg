<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
<defs>
<linearGradient id="bg3" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" style="stop-color:#fef9c3;stop-opacity:1"/>
<stop offset="100%" style="stop-color:#fde68a;stop-opacity:1"/>
</linearGradient>
<linearGradient id="bottle3" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1"/>
<stop offset="50%" style="stop-color:#f59e0b;stop-opacity:1"/>
<stop offset="100%" style="stop-color:#d97706;stop-opacity:1"/>
</linearGradient>
<linearGradient id="cap3" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" style="stop-color:#92400e;stop-opacity:1"/>
<stop offset="100%" style="stop-color:#78350f;stop-opacity:1"/>
</linearGradient>
</defs>
<rect width="200" height="240" fill="url(#bg3)"/>
<!-- Dropper bottle -->
<rect x="70" y="85" width="60" height="135" rx="4" fill="url(#bottle3)"/>
<!-- Dropper cap -->
<rect x="78" y="35" width="44" height="55" rx="3" fill="url(#cap3)"/>
<rect x="80" y="50" width="40" height="35" fill="#7c2d12"/>
<!-- Dropper inside -->
<rect x="95" y="90" width="10" height="40" fill="white" opacity="0.4"/>
<!-- Label -->
<rect x="73" y="120" width="54" height="70" fill="white" rx="2"/>
<text x="100" y="138" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="#92400e">AURELIA</text>
<text x="100" y="152" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#d97706">VITAMIN C</text>
<text x="100" y="167" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#f59e0b">15%</text>
<text x="100" y="182" text-anchor="middle" font-family="Arial" font-size="6" fill="#92400e">SERUM</text>
<!-- Highlight -->
<rect x="72" y="90" width="6" height="125" fill="white" opacity="0.4" rx="2"/>
<!-- Vitamin C illustration (orange) -->
<circle cx="100" cy="105" r="6" fill="#f97316" opacity="0.7"/>
</svg>
