<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
<defs>
<linearGradient id="bg8" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" style="stop-color:#eff6ff;stop-opacity:1"/>
<stop offset="100%" style="stop-color:#dbeafe;stop-opacity:1"/>
</linearGradient>
<linearGradient id="bottle8" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" style="stop-color:#1d4ed8;stop-opacity:1"/>
<stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1"/>
<stop offset="100%" style="stop-color:#1e3a8a;stop-opacity:1"/>
</linearGradient>
<linearGradient id="cap8" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1"/>
<stop offset="100%" style="stop-color:#172554;stop-opacity:1"/>
</linearGradient>
</defs>
<rect width="200" height="240" fill="url(#bg8)"/>
<!-- Cylinder bottle -->
<rect x="50" y="70" width="100" height="160" rx="6" fill="url(#bottle8)"/>
<!-- Flip cap -->
<rect x="58" y="25" width="84" height="50" rx="4" fill="url(#cap8)"/>
<rect x="58" y="25" width="84" height="6" fill="#0f172a"/>
<!-- Label -->
<rect x="55" y="110" width="90" height="105" fill="white" rx="2"/>
<text x="100" y="128" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1e3a8a">PanOxyl</text>
<line x1="65" y1="135" x2="135" y2="135" stroke="#bfdbfe" stroke-width="0.5"/>
<text x="100" y="150" text-anchor="middle" font-family="Arial" font-size="8" fill="#1e40af">ACNE</text>
<text x="100" y="162" text-anchor="middle" font-family="Arial" font-size="8" fill="#1e40af">FOAMING WASH</text>
<text x="100" y="180" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#dc2626">10%</text>
<text x="100" y="195" text-anchor="middle" font-family="Arial" font-size="7" fill="#64748b">Benzoyl Peroxide</text>
<text x="100" y="208" text-anchor="middle" font-family="Arial" font-size="6" fill="#94a3b8">156 g / 5.5 oz</text>
<!-- Highlight -->
<rect x="55" y="75" width="6" height="150" fill="white" opacity="0.4" rx="2"/>
</svg>
